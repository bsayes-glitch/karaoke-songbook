<style>
:root{--bg:#0f1115;--panel:#171a21;--text:#f5f7fa;--muted:#aab2c0;--accent:#ff3b30;--border:#2a2f3a}

.btn{display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:44px;border-radius:10px;background:var(--accent);color:white;text-decoration:none;font-weight:700;padding:10px 14px}
.empty{color:var(--muted);padding:24px 2px}.note{color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:520px){h1{font-size:25px}.item{grid-template-columns:1fr}.btn{width:100%}}
</style>
